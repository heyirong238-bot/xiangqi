name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - run: |
          unzip -q -o "象棋1.0.zip"
          cp pikafish-armv8 XiangqiHelper/app/src/main/jniLibs/arm64-v8a/libpikafish.so
          cd XiangqiHelper
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: XiangqiHelper/app/build/outputs/apk/debug/*.apk
        
